$kind: http-request
url: https://the-internet.herokuapp.com/api/sessions
method: POST
body:
  type: json
  content: "\r

    {\r

    \  \"username\": \"tomsmith\"\r

    }\r\n"
scripts:
  - type: afterResponse
    code: "\r

      pm.test('Status code is 400', () => {\r

      \  pm.response.to.have.status(400);\r

      });\r

      \r

      pm.test('Password required error is correct', () => {\r

      \  const response = pm.response.json();\r

      \  pm.expect(response.error).to.eql('password is required');\r

      });\r\n"
    language: text/javascript
order: 3000
