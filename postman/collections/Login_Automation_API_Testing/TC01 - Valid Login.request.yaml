$kind: http-request
description: ""
url: https://the-internet.herokuapp.com/api/sessions
method: POST
body:
  type: json
  content: "\r

    {\r

    \  \"username\": \"tomsmith\",\r

    \  \"password\": \"SuperSecretPassword!\"\r

    }\r\n"
scripts:
  - type: afterResponse
    code: "\r

      pm.test('Status code is 200', () => {\r

      \  pm.response.to.have.status(200);\r

      });\r

      \r

      pm.test('Username is correct', () => {\r

      \  const response = pm.response.json();\r

      \  pm.expect(response.username).to.eql('tomsmith');\r

      });\r

      \r

      pm.test('Response time is under 3000 ms', () => {\r

      \  pm.expect(pm.response.responseTime).to.be.below(3000);\r

      });\r\n"
    language: text/javascript
order: 1000
